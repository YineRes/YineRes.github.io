<!DOCTYPE html>
<!-- 声明文档类型为HTML5 -->
<html lang="zh-CN">
<!-- html根标签，lang指定页面语言：简体中文 -->
<head>
    <!-- 头部区域：存放页面配置、编码、标题、样式，不会直接显示在页面上 -->
    <meta charset="UTF-8">
    <!-- 设置网页文字编码为UTF-8，避免中文乱码 -->
    <title>我的个人Wiki主页</title>
    <!-- 浏览器标签页显示的标题文字 -->
    <style>
        /* CSS样式区域：统一控制页面布局、字体、颜色、间距等外观 */
        /* Wiki简洁样式 */
        body {
            max-width: 800px;       /* 页面内容最大宽度800px，不会过宽刺眼 */
            margin: 50px auto;      /* 上下外边距50px，左右auto实现整体居中 */
            padding: 0 20px;        /* 左右内边距20px，手机浏览不会紧贴屏幕边缘 */
            font-family: "微软雅黑",sans-serif; /* 优先微软雅黑字体，无则使用系统无衬线字体 */
            color: #333;            /* 正文文字颜色：深灰色，比纯黑色柔和护眼 */
            line-height: 1.8;       /* 行高1.8倍，文字宽松舒适，阅读体验更好 */
        }
        h1 {
            border-bottom: 1px solid #cccccc; /* 标题下方添加一条浅灰色分割线 */
            padding-bottom: 10px;             /* 文字和下方分割线留出间距 */
        }
        a {
            color: #0066cc;         /* 超链接默认蓝色 */
            text-decoration: none;  /* 取消链接默认自带的下划线 */
        }
        a:hover {
            text-decoration: underline; /* 鼠标悬浮到链接上时，显示下划线，提示可点击 */
        }
        ul {
            font-size: 18px;        /* 无序列表文字大小18px */
        }
    </style>
</head>
<body>
    <!-- 主体可视区域：所有网页文字、按钮、链接都会展示在这里 -->
    <h1>个人知识库 Wiki</h1>
    <!-- 一级大标题，页面主标题 -->
    <p>欢迎来到我的简易维基站点，点击下方条目跳转查看详情</p>
    <!-- 段落文本，页面导语说明 -->

    <h3>目录导航</h3>
    <!-- 三级小标题：导航栏标题 -->
    <ul>
        <!-- 无序列表容器，存放多条导航链接 -->
        <li><a href="intro.html">站点介绍</a></li>
        <!-- li：列表项；a超链接：href填写跳转页面文件名，点击文字跳转到intro.html介绍页 -->
        <li><a href="log.html">更新日志</a></li>
        <!-- 跳转到更新日志页面 -->
        <li><a href="project.html">个人项目合集</a></li>
        <!-- 跳转到个人项目页面 -->
    </ul>
</body>
</html>
